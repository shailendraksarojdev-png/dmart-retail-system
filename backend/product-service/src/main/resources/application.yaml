spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shailendrasaroj
    username: shailendrasaroj
    password: 1234
    driver-class-name: org.postgresql.Driver

  jjpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE