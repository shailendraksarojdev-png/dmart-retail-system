version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dmart-db
    environment:
      POSTGRES_DB: dmart
      POSTGRES_USER: shailendrasaroj
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dmart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shailendrasaroj"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmart-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmart
      SPRING_DATASOURCE_USERNAME: shailendrasaroj
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dmart-network
    restart: unless-stopped
    # Wait for database to be ready before starting
    command: sh -c 'sleep 10 && java -jar app.jar'

volumes:
  postgres_data:
    driver: local

networks:
  dmart-network:
    driver: bridge
