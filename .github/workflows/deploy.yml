name: build and deploy Dmart retail system

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: dmart-retail-system

jobs:
  # JOB 1: Compile the Java Application
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setting Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: build jar
        run: mvn clean package -DskipTests

      # Upload the generated jar file so the Docker job can see it
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmart-jar
          path: target/*.jar
          retention-days: 1

  # JOB 2: Build and Publish the Docker Image
  package-docker:
    runs-on: ubuntu-latest
    needs: build-jar # Forces this job to wait until Job 1 passes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: building docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to docker hub
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest

  # JOB 3: Remotely Deploy to AWS EC2
  deploy-ec2:
    runs-on: ubuntu-latest
    needs: package-docker # Forces this job to wait until Job 2 passes
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            docker pull ${{secrets.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest
            docker stop ${{secrets.DOCKER_CONTAINER_NAME}}||true
            docker rm ${{secrets.DOCKER_CONTAINER_NAME}}||true
            docker run -d \
                        --name dmart-retail-system \
                        --network dmart-retail-system_dmart-network \
                        --restart unless-stopped \
                        -e SPRING_DATASOURCE_URL=jdbc:postgresql://dmart-db:5432/dmart \
                        -e SPRING_DATASOURCE_USERNAME=shailendrasaroj \
                        -e SPRING_DATASOURCE_PASSWORD=1234 \
                        -p 8080:8080 \
                        ${{ secrets.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:latest
            docker image prune -f
